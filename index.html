<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafadiStream</title>
<style>
:root{color-scheme:dark;--bg:#070d18;--panel:#0e1727;--panel2:#111e31;--line:#26364d;--text:#f3f6fc;--muted:#9baec7;--blue:#1687ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#101c30 0,#070d18 58%);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:18px;padding:18px 24px;background:#09111fef;border-bottom:1px solid #1b2a40;backdrop-filter:blur(14px)}
.logo{width:42px;height:42px;display:grid;place-items:center;background:#102d51;border-radius:12px;color:#54a8ff;font-size:23px}
h1{font-size:24px;margin:0;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.header-spacer{flex:1}
#search{width:min(340px,38vw);padding:12px 14px;background:#0a1322;border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;outline:none}
#search:focus{border-color:var(--blue)}
main{max-width:1700px;margin:auto;padding:20px 24px 40px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;color:var(--muted);font-size:13px}
.count{color:#dce7f8}
.channel-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.channel-filter label{color:var(--muted)}
.channel-filter select{background:#0b1422;color:#eaf1fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:12px}
.channel{min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;padding:5px 4px 8px;min-height:100px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);cursor:pointer;transition:transform .15s,background .15s}
.channel:hover{transform:translateY(-2px);background:#132239}
.channel.active{background:#102746;box-shadow:inset 0 0 0 1px var(--blue)}
.tv-screen{position:relative;display:grid;place-items:center;width:100%;max-width:108px;height:61px;border:5px solid #3a4a61;border-radius:9px;background:radial-gradient(ellipse at 35% 25%,#1f4670,#091322 70%);box-shadow:inset 0 0 0 1px #7890ac,0 3px 0 #1b293b}
.tv-screen:after{content:"";position:absolute;bottom:-12px;left:calc(50% - 3px);width:6px;height:8px;background:#43536a;border-radius:0 0 2px 2px}
.tv-screen:before{content:"";position:absolute;bottom:-14px;left:calc(50% - 15px);width:30px;height:3px;background:#43536a;border-radius:3px}
.num{font-size:18px;font-weight:750;display:block;color:#dceeff;text-shadow:0 1px 8px #1687ff88}
.channel-label{font-size:11px;color:var(--muted);max-width:100%;overflow-wrap:anywhere}
.play{position:absolute;right:7px;top:10px;color:#91a9c8;font-size:10px}
.channel[hidden]{display:none}
.empty{display:none;padding:40px;text-align:center;color:var(--muted)}
.channel-group{margin-bottom:26px}
.channel-group-title{font-size:16px;font-weight:700;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line);color:#dce7f8}
.channel-group[hidden]{display:none}
.dashboard{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.channels-area{min-width:0}
.scores-sidebar{position:sticky;top:96px;min-width:0;background:linear-gradient(145deg,#0e1727,#0a1321);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 12px 35px #0002}
.scores-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.scores-heading h2{font-size:19px;margin:0;letter-spacing:-.3px}
.scores-heading p{font-size:12px;color:var(--muted);margin:4px 0 0}
.refresh-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:#111e31;color:var(--text);font-size:23px;cursor:pointer}
.score-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:4px;background:#080f1b;border:1px solid #1d2b40;border-radius:10px;margin-bottom:12px}
.score-tab{padding:8px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.score-tab.selected{background:#16345a;color:#fff;box-shadow:inset 0 0 0 1px #2b5c91}
.scores-status{font-size:12px;color:var(--muted);padding:10px 2px}
.scores-status.error{color:#ffb4b4}
.scores-list{display:grid;gap:10px}
.game-card{padding:12px;border:1px solid #22334a;border-radius:11px;background:#0b1422}
.game-topline{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin-bottom:10px}
.game-state{color:#8fc5ff;font-weight:700;text-align:right}
.game-state.live-state{color:#ff8585}
.team-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 0}
.team-identity{display:flex;align-items:center;gap:8px;min-width:0}
.team-logo{width:28px;height:28px;object-fit:contain;flex:0 0 28px}
.team-name{font-size:13px;font-weight:650;overflow-wrap:anywhere}
.team-abbr{color:var(--muted);font-size:10px;margin-left:5px;font-weight:500}
.team-score{font-size:16px;font-weight:750;font-variant-numeric:tabular-nums}
.game-bottom{font-size:11px;color:var(--muted);border-top:1px solid #1b2a3d;margin-top:7px;padding-top:8px}
.game-channel{font-size:12px;color:#b9d9ff;margin-top:6px;font-weight:650}
.game-channel span{color:var(--muted);font-weight:500}
.empty-games{padding:22px 12px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed #2a3a51;border-radius:10px}
.scores-footnote{font-size:10px;line-height:1.5;color:#7f92ab;margin:14px 2px 0}
@media(max-width:1250px){.dashboard{grid-template-columns:minmax(0,1fr) 290px}.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:900px){header{padding:14px;flex-wrap:wrap}.header-spacer{display:none}#search{width:100%;order:4}.dashboard{grid-template-columns:1fr}.scores-sidebar{position:static;grid-row:1}.channels-area{grid-row:2}.scores-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){main{padding:14px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.scores-sidebar{padding:12px}.scores-list{grid-template-columns:1fr}.dashboard{gap:16px}.toolbar{align-items:flex-start;flex-direction:column}h1{font-size:20px}}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">▣</div>
  <div><h1>SafadiStream</h1><div class="sub">100 channels · Live sports scores</div></div>
  <div class="header-spacer"></div>
  <input id="search" type="search" placeholder="Search channels…" aria-label="Search channels">
</header>

<main class="dashboard">
  <section class="channels-area" aria-label="Sports channels">
    <div class="toolbar">
      <span>Choose a channel</span>
      <div class="channel-filter">
        <label for="channel-league-filter">Show channels for</label>
        <select id="channel-league-filter">
          <option value="all">All leagues</option>
          <option value="nba">NBA</option>
          <option value="nfl">NFL</option>
          <option value="mlb">MLB</option>
          <option value="nhl">NHL</option>
        </select>
        <span class="count" id="count">100 channels</span>
      </div>
    </div>
    <section class="channel-group" id="labeled-section">
      <h2 class="channel-group-title" id="labeled-title">Labeled Channels</h2>
      <section class="grid" id="labeled-grid"></section>
    </section>
    <section class="channel-group" id="other-section">
      <h2 class="channel-group-title">Other Channels</h2>
      <section class="grid" id="other-grid"></section>
    </section>
    <div class="empty" id="empty">No channels match your search.</div>
  </section>

  <aside class="scores-sidebar" aria-label="Today's sports scores">
    <div class="scores-heading">
      <div><h2>Today's Scores</h2><p id="scores-date">NBA · Local date</p></div>
      <button type="button" id="refresh-scores" class="refresh-btn" aria-label="Refresh scores">↻</button>
    </div>
    <div class="score-tabs" role="tablist" aria-label="League">
      <button type="button" class="score-tab selected" data-league="nba" role="tab" aria-selected="true">NBA</button>
      <button type="button" class="score-tab" data-league="nfl" role="tab" aria-selected="false">NFL</button>
      <button type="button" class="score-tab" data-league="mlb" role="tab" aria-selected="false">MLB</button>
      <button type="button" class="score-tab" data-league="nhl" role="tab" aria-selected="false">NHL</button>
    </div>
    <div id="scores-status" class="scores-status" aria-live="polite">Loading today's scores…</div>
    <section id="scores-list" class="scores-list" aria-label="Games"></section>
    <p class="scores-footnote">Scores and start times provided by ESPN. Refreshes automatically every 60 seconds.</p>
  </aside>
</main>

  99:'https://streamec.st/stream-east/ch99.php',
  100:'https://streamec.st/stream-east/ch100.php'
};

const TOTAL=100;
const CHANNEL_LABELS={
  30:'NFL Net',
  32:'CBS',33:'CBS',34:'CBS',
  35:'FOX',36:'FOX',37:'FOX',38:'FOX',39:'FOX',40:'FOX',41:'FOX',
  42:'Redzone',43:'NFL Net',
  47:'TNT2',49:'Sky Sports',67:'NBC',94:'CW',95:'ESPN'
};

const labeledGrid=document.getElementById('labeled-grid');
const otherGrid=document.getElementById('other-grid');
const search=document.getElementById('search');
const cards=new Map();
let activeChannelLeague='all';

for(let n=1;n<=TOTAL;n++){
  const button=document.createElement('button');
  button.className='channel';
  button.type='button';
  button.dataset.channel=String(n);
  const label=CHANNEL_LABELS[n]||'Channel';
  button.innerHTML=`<span class="tv-screen"><span class="num">${n}</span></span><span class="channel-label">${label}</span><span class="play" aria-hidden="true">▶</span>`;
  button.setAttribute('aria-label',`Channel ${n}${CHANNEL_LABELS[n]?': '+CHANNEL_LABELS[n]:''}`);
  button.addEventListener('click',()=>openChannel(n));
  (CHANNEL_LABELS[n]?labeledGrid:otherGrid).appendChild(button);
  cards.set(n,button);
}

let current=1;
function openChannel(n){
  current=n;
  const url=CHANNEL_URLS[n];
  if(!url){
    alert(`Channel ${n} has no URL configured.`);
    return;
  }
  // Opens the configured channel URL directly in a new window.
  window.open(url,`sports-channel-${n}`,'popup,width=1100,height=720,resizable=yes,scrollbars=yes');
}

function normalizeNetwork(text){
  const s=String(text||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  if(/\bnfl\s*(network|net)\b/.test(s))return 'NFL Net';
  if(/red ?zone|redzone/.test(s))return 'Redzone';
  if(/\bfox\b/.test(s))return 'FOX';
  if(/\bcbs\b/.test(s))return 'CBS';
  if(/\bespn\b/.test(s))return 'ESPN';
  if(/\bnbc\b/.test(s))return 'NBC';
  if(/\btnt\b/.test(s))return 'TNT2';
  if(/\bcw\b/.test(s))return 'CW';
  if(/sky sports/.test(s))return 'Sky Sports';
  return null;
}

let scoreboardData={nba:[],nfl:[],mlb:[],nhl:[]};
let scoreboardErrors={nba:false,nfl:false,mlb:false,nhl:false};
let scoreboardLastUpdated=null;
let activeLeague='nba';

const scoresList=document.getElementById('scores-list');
const scoresStatus=document.getElementById('scores-status');
const scoresDate=document.getElementById('scores-date');
const refreshButton=document.getElementById('refresh-scores');
const scoreTabs=[...document.querySelectorAll('.score-tab')];

function localDateKey(date=new Date()){
  return `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`;
}
function formatLocalDate(date=new Date()){
  return new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(date);
}
function safeText(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function eventLocalDate(event){
  if(!event.date)return '';
  const d=new Date(event.date);
  return Number.isNaN(d.getTime())?'':localDateKey(d);
}
function getEventState(event){
  const status=event.status||event.competitions?.[0]?.status||{};
  const type=status.type||{};
  return {state:type.state||'',detail:type.shortDetail||type.detail||type.description||'Scheduled',completed:Boolean(type.completed)};
}
function formatGameTime(event){
  if(!event.date)return 'Time TBD';
  const d=new Date(event.date);
  if(Number.isNaN(d.getTime()))return 'Time TBD';
  return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function normalizeEvent(event){
  const competition=event.competitions?.[0]||{};
  const competitors=competition.competitors||[];
  const home=competitors.find(t=>t.homeAway==='home')||competitors[0]||{};
  const away=competitors.find(t=>t.homeAway==='away')||competitors[1]||{};
  const status=getEventState(event);
  const broadcastEntries=competition.broadcasts||event.broadcasts||[];
  const channelNames=[...new Set(broadcastEntries.flatMap(item=>{
    if(typeof item==='string')return [item];
    const names=Array.isArray(item.names)?item.names:[];
    const mediaName=item.media?.shortName||item.media?.name||item.shortName||item.name;
    return [...names,...(mediaName?[mediaName]:[])];
  }).map(name=>String(name).trim()).filter(Boolean))];

  return {
    id:event.id,
    name:event.name||event.shortName||'Game',
    home:{
      name:home.team?.displayName||home.team?.name||'Home',
      abbr:home.team?.abbreviation||'',
      score:home.score??'—',
      logo:home.team?.logos?.[0]?.href||home.team?.logo||''
    },
    away:{
      name:away.team?.displayName||away.team?.name||'Away',
      abbr:away.team?.abbreviation||'',
      score:away.score??'—',
      logo:away.team?.logos?.[0]?.href||away.team?.logo||''
    },
    channels:channelNames,
    state:status.state,
    detail:status.detail,
    completed:status.completed,
    time:formatGameTime(event),
    date:event.date||''
  };
}

function networksForLeague(league){
  return new Set((scoreboardData[league]||[]).flatMap(game=>(game.channels||[]).map(normalizeNetwork).filter(Boolean)));
}
function filterChannels(){
  const q=search.value.trim().toLowerCase();
  const networks=activeChannelLeague==='all'?null:networksForLeague(activeChannelLeague);
  let shown=0,labeledShown=0,otherShown=0;

  for(const [n,card] of cards){
    const rawLabel=CHANNEL_LABELS[n]||'';
    const label=rawLabel.toLowerCase();
    const textMatch=`channel ${n}`.includes(q)||String(n).includes(q)||label.includes(q);
    const leagueMatch=activeChannelLeague==='all'||(rawLabel&&networks.has(rawLabel));
    const match=textMatch&&leagueMatch;
    card.hidden=!match;
    if(match){
      shown++;
      if(rawLabel)labeledShown++;else otherShown++;
    }
  }

  const leagueName=activeChannelLeague==='all'?'':activeChannelLeague.toUpperCase();
  document.getElementById('labeled-title').textContent=leagueName?`${leagueName} Channels Currently Listed on Today's Scores`:'Labeled Channels';
  document.getElementById('count').textContent=`${shown} channel${shown===1?'':'s'}`;
  document.getElementById('labeled-section').hidden=labeledShown===0;
  document.getElementById('other-section').hidden=otherShown===0;
  document.getElementById('empty').style.display=shown?'none':'block';
  document.getElementById('empty').textContent=activeChannelLeague==='all'?'No channels match your search.':`No labeled channels match ${leagueName} games listed today. Try another league or All leagues.`;
}
search.addEventListener('input',filterChannels);
document.getElementById('channel-league-filter').addEventListener('change',e=>{
  activeChannelLeague=e.target.value;
  filterChannels();
});

function renderScores(){
  const leagueLabel=activeLeague.toUpperCase();
  scoresDate.textContent=`${leagueLabel} · ${formatLocalDate()}`;
  scoreTabs.forEach(tab=>{
    const selected=tab.dataset.league===activeLeague;
    tab.classList.toggle('selected',selected);
    tab.setAttribute('aria-selected',String(selected));
  });

  if(scoreboardErrors[activeLeague]&&!scoreboardData[activeLeague].length){
    scoresStatus.className='scores-status error';
    scoresStatus.textContent='Could not load scores. Check your connection and try refreshing.';
    scoresList.innerHTML='';
    return;
  }

  const games=scoreboardData[activeLeague]||[];
  if(!games.length){
    scoresStatus.className='scores-status';
    scoresStatus.textContent=scoreboardLastUpdated?'No games listed for today.':'Loading today’s scores…';
    scoresList.innerHTML=scoreboardLastUpdated?'<div class="empty-games">No games scheduled for today.</div>':'';
    return;
  }

  scoresStatus.className='scores-status';
  scoresStatus.textContent=`${games.length} game${games.length===1?'':'s'} · Updated ${scoreboardLastUpdated?scoreboardLastUpdated.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'—'}`;

  scoresList.innerHTML=games.map(game=>{
    const live=game.state==='in';
    const stateClass=live?'game-state live-state':'game-state';
    const stateLabel=live?`● ${game.detail}`:game.completed?game.detail:(game.state==='pre'?game.time:game.detail);
    const awayScore=game.state==='pre'?'—':game.away.score;
    const homeScore=game.state==='pre'?'—':game.home.score;

    const teamRow=(team,score)=>`
      <div class="team-row">
        <div class="team-identity">
          ${team.logo?`<img class="team-logo" src="${safeText(team.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:''}
          <div class="team-name">${safeText(team.name)}<span class="team-abbr">${safeText(team.abbr)}</span></div>
        </div>
        <div class="team-score">${safeText(score)}</div>
      </div>`;

    return `<article class="game-card">
      <div class="game-topline"><span>${safeText(game.name)}</span><span class="${stateClass}">${safeText(stateLabel)}</span></div>
      ${teamRow(game.away,awayScore)}
      ${teamRow(game.home,homeScore)}
      <div class="game-channel">Channel: <span>${safeText(game.channels?.length?game.channels.join(', '):'Not listed by ESPN')}</span></div>
      <div class="game-bottom">${game.completed?'Final':live?'Live game':`Scheduled for ${safeText(game.time)}`}</div>
    </article>`;
  }).join('');
}

async function loadLeagueScores(league){
  const sportPaths={nba:'basketball/nba',nfl:'football/nfl',mlb:'baseball/mlb',nhl:'hockey/nhl'};
  const url=`https://site.api.espn.com/apis/site/v2/sports/${sportPaths[league]}/scoreboard?dates=${localDateKey()}`;

  try{
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error(`ESPN returned ${response.status}`);
    const data=await response.json();
    const events=Array.isArray(data.events)?data.events:[];
    scoreboardData[league]=events
      .filter(event=>eventLocalDate(event)===localDateKey())
      .map(normalizeEvent)
      .sort((a,b)=>Number(a.completed)-Number(b.completed)||new Date(a.date)-new Date(b.date));
    scoreboardErrors[league]=false;
    filterChannels();
  }catch(error){
    console.warn(`Could not load ${league.toUpperCase()} scores`,error);
    scoreboardErrors[league]=true;
  }
}

let scoreRefreshInProgress=false;
async function refreshScores(){
  if(scoreRefreshInProgress)return;
  scoreRefreshInProgress=true;
  refreshButton.disabled=true;
  refreshButton.textContent='…';
  scoresStatus.className='scores-status';
  scoresStatus.textContent='Refreshing scores…';

  try{
    await Promise.all(['nba','nfl','mlb','nhl'].map(loadLeagueScores));
    scoreboardLastUpdated=new Date();
    renderScores();
  }finally{
    scoreRefreshInProgress=false;
    refreshButton.disabled=false;
    refreshButton.textContent='↻';
  }
}

scoreTabs.forEach(tab=>tab.addEventListener('click',()=>{
  activeLeague=tab.dataset.league;
  renderScores();
}));
refreshButton.addEventListener('click',refreshScores);

renderScores();
refreshScores();
setInterval(()=>{if(!document.hidden)refreshScores()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshScores()});
</script>
